# Local SonarQube (self-hosted, http://localhost:9000) — pre-push / pre-merge gate.
# Scan from the repo root:
#   .venv/bin/pytest --cov --cov-report=xml && SONAR_TOKEN=... sonar-scanner
# The token is the machine's global analysis token; it never goes in this file.
sonar.projectKey=espectre-lab
sonar.projectName=espectre-lab
sonar.host.url=http://localhost:9000

sonar.sources=experiments/tools,esphome,.github/workflows
sonar.tests=tests
sonar.exclusions=esphome/.esphome/**,esphome/secrets.yaml

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.qualitygate.wait=true
